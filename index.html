<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Guesser</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>あなたの年齢を当てます</h1>
    <p>0〜120歳の年齢を思い浮かべてください。</p>

    <p id="question">あなたは60歳ですか？</p>

    <div>
      <button id="lower">もっと下</button>
      <button id="correct">正解！</button>
      <button id="higher">もっと上</button>
    </div>

    <p id="result"></p>
    <button id="restart">もう一度遊ぶ</button>
  </main>
</body>
</html>
